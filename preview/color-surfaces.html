<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="_card.css">
</head>
<body>
  <p class="lbl">Surfaces &amp; photo overlays</p>
  <div class="card-row">
    <div class="swatch"><div class="chip" style="background:#ffffff; border-bottom:1px solid var(--mhi-line);"></div><div class="meta"><div class="name">White</div><div class="hex">#ffffff</div></div></div>
    <div class="swatch"><div class="chip" style="background:#f9fbf9;"></div><div class="meta"><div class="name">Paper</div><div class="hex">#f9fbf9</div></div></div>
    <div class="swatch"><div class="chip" style="background:#323232;"></div><div class="meta"><div class="name">Hero overlay</div><div class="hex">#323232 · 60%</div></div></div>
    <div class="swatch"><div class="chip" style="background:#00132d;"></div><div class="meta"><div class="name">CTA navy</div><div class="hex">#00132d · 65%</div></div></div>
    <div class="swatch"><div class="chip" style="background:#595959;"></div><div class="meta"><div class="name">Btn grey</div><div class="hex">#595959</div></div></div>
  </div>
  <p style="font-size:12px; color:var(--mhi-body); margin:14px 0 0; line-height:1.5;">Sections alternate white ↔ paper. Photo banners carry a solid-color overlay at opacity so white text stays legible.</p>
</body></html>
