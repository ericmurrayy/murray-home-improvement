<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="_card.css">
<style>
  .fam { margin-bottom:18px; }
  .fam:last-child { margin-bottom:0; }
  .big { font-size:40px; line-height:1; color:var(--mhi-ink); margin:0 0 6px; }
  .alpha { font-size:15px; color:var(--mhi-body); margin:0; }
  .tag { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--mhi-blue); font-weight:600; margin:0 0 8px; }
</style></head>
<body>
  <div class="fam">
    <p class="tag">Roboto — UI &amp; body</p>
    <p class="big" style="font-family:var(--font-sans); font-weight:700;">Murray Home Improvement</p>
    <p class="alpha" style="font-family:var(--font-sans);">400 Regular · 500 Medium · 600 Semibold · 700 Bold</p>
  </div>
  <div class="fam">
    <p class="tag">Roboto Slab — serif accent</p>
    <p class="big" style="font-family:var(--font-slab); font-weight:600;">Built to last since 1989</p>
    <p class="alpha" style="font-family:var(--font-slab);">Reserved for pull quotes &amp; numerals — not body copy</p>
  </div>
</body></html>
