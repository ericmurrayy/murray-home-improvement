<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="_card.css">
<style>
  .row { display:flex; gap:14px; }
  .panel { flex:1; border:1px solid var(--mhi-line); border-radius:4px; display:flex; align-items:center; justify-content:center; padding:24px; min-height:96px; }
  .light { background:#fff; }
  .paper { background:#f9fbf9; }
  .panel img { width:200px; height:auto; }
  .note { font-size:11px; color:var(--mhi-muted); font-family:var(--font-slab); margin:10px 0 0; }
</style></head>
<body>
  <p class="lbl">Primary logo — place on light surfaces only</p>
  <div class="row">
    <div class="panel light"><img src="../assets/murray-logo.png" alt="Murray Home Improvement"></div>
    <div class="panel paper"><img src="../assets/murray-logo.png" alt="Murray Home Improvement"></div>
  </div>
  <p class="note">Metallic-blue beveled italic wordmark · 288×84 · transparent PNG · keep clear space · do not recolor.</p>
</body></html>
