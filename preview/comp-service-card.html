<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { background:#f9fbf9; }
  .card { width:300px; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.08); border-radius:4px; overflow:hidden; }
  .card img { display:block; width:100%; height:150px; object-fit:cover; }
  .body { padding:14px 16px 18px; }
  .ttl { font-size:18px; font-weight:600; color:#007bff; margin:0 0 6px; }
  .desc { font-size:13.5px; color:#696969; line-height:1.5; margin:0; }
</style></head>
<body>
  <p class="lbl">Service card — image-box pattern</p>
  <div class="card">
    <img src="../assets/kitchen-remodel.jpg" alt="Kitchen remodel">
    <div class="body">
      <h5 class="ttl">Kitchens</h5>
      <p class="desc">Breathe new life into your tired old kitchen with our full remodeling service.</p>
    </div>
  </div>
</body></html>
