<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="_card.css">
<style>
  .spec { display:flex; align-items:baseline; gap:14px; padding:7px 0; border-bottom:1px solid var(--mhi-line); }
  .spec:last-child { border-bottom:0; }
  .spec .t { color:var(--mhi-ink); }
  .spec .d { margin-left:auto; font-size:11px; color:var(--mhi-muted); font-family:var(--font-slab); white-space:nowrap; }
</style></head>
<body>
  <p class="lbl">Type scale — Roboto</p>
  <div class="spec"><span class="t" style="font-size:34px; font-weight:700;">REMODELING EXPERTS</span><span class="d">Hero · 4rem / 700</span></div>
  <div class="spec"><span class="t" style="font-size:26px; font-weight:600;">Section heading</span><span class="d">H2 · 2rem / 600</span></div>
  <div class="spec"><span class="t" style="font-size:19px; font-weight:600;">Why choose Murray?</span><span class="d">H4 · 1.3rem / 600</span></div>
  <div class="spec"><span class="t" style="font-size:16px; font-weight:600; color:var(--mhi-blue);">Kitchens</span><span class="d">Card title · H5 / 600</span></div>
  <div class="spec"><span class="t" style="font-size:16px; font-weight:400; color:var(--mhi-body);">Body copy at a comfortable 1.618 line-height.</span><span class="d">Body · 1.1rem / 400</span></div>
</body></html>
