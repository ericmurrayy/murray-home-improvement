<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding:0; }
  .imgs { display:flex; gap:0; }
  .imgs figure { margin:0; flex:1; }
  .imgs img { display:block; width:100%; height:130px; object-fit:cover; }
  .cap { padding:10px 14px; }
  .note { font-size:11px; color:var(--mhi-muted); font-family:var(--font-slab); margin:0; }
</style></head>
<body>
  <div class="imgs">
    <figure><img src="../assets/bath-remodel.jpg" alt="Bathroom"></figure>
    <figure><img src="../assets/kitchen-remodel.jpg" alt="Kitchen"></figure>
    <figure><img src="../assets/exterior-remodel.jpg" alt="Exterior"></figure>
  </div>
  <div class="cap"><p class="note">Imagery — real, candid project photos. Cool/neutral palette, natural light, no filters or B&amp;W. The work is the hero.</p></div>
</body></html>
